<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nuke'em Situation Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Stardos+Stencil:wght@700&display=swap">
<style>
  /* Layout: the Field Manual's leaked dossier, turned into a situation room. A manila rail with the Clock;
     the world map's city boxes on the left, the decision slip and wire log pinned on the right;
     player boards and your hand below. One paper look on purpose: it is a printed file. */
  :root{
    color-scheme:light;
    --ground:#e7e5dc; --paper:#f6f5ef; --paper-2:#edebe2;
    --line:#b5b2a3; --line-soft:#d4d1c4;
    --ink:#1b1c19; --ink-dim:#3b3c36; --ink-faint:#6a695f;
    --stamp:#b42318; --manila:#d8c28c; --manila-deep:#bfa465; --memo:#f7efc9;
    --na:#3f86c4; --eu:#c9a020; --as:#c8372d; --af:#3f9e6e;
    --weapon:#c8372d; --decoy:#a08a5c; --shield:#3f86c4; --special:#3f9e6e; --upgrade:#8a5cc2;
    --success:#c2185b; --backfire:#6b6b66; --trick:#00897b;
    --fallout:#3b3c36;
    --display:"Big Shoulders Stencil Display","Stardos Stencil",Impact,sans-serif;
    --cardname:"Stardos Stencil","Stencil",Impact,sans-serif;
    --body:"Barlow","Bahnschrift",Arial,sans-serif;
    --label:"Barlow Condensed","Bahnschrift","Arial Narrow",sans-serif;
    --mono:"Courier Prime","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{background:var(--ground);color:var(--ink)}
  body{font-family:var(--body);font-size:15px;line-height:1.45}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--manila)}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

  /* rail */
  /* the band bleeds past any side padding the host puts around the page: shadows paint outside the box
     without widening the page, and the clip keeps them to the band's own height (+3px for the bottom rule) */
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--manila);
    box-shadow:0 0 0 100vmax var(--manila),0 3px 0 100vmax var(--manila-deep);clip-path:inset(0 -100vmax -3px)}
  .railin{max-width:1520px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:8px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mark{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.04em;line-height:1}
  .mark i{color:var(--stamp);font-style:normal}
  .round{font-family:var(--label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--ink-dim)}
  .clock{display:flex;gap:2px;align-items:center;flex:1 1 320px;min-width:0}
  .clock i{flex:1 1 0;min-width:0;height:18px;border:1px solid var(--manila-deep);background:var(--paper);font-style:normal;
    font-family:var(--mono);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);overflow:hidden}
  .clock i.gone{background:var(--manila-deep);border-color:var(--manila-deep);color:transparent}
  .clock i.now{background:var(--stamp);border-color:var(--stamp);color:var(--paper);font-weight:700;font-size:11px}
  .clock i.mid{border-color:var(--stamp);color:var(--stamp);font-weight:700}
  .tools{display:flex;gap:6px;margin-left:auto}
  .tools button{background:var(--manila-deep);border:0;border-radius:6px 6px 0 0;padding:7px 12px 6px;font-family:var(--label);
    font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .tools button:hover{background:var(--paper)}
  .tools button[disabled]{opacity:.45;cursor:default}

  .wrap{max-width:1520px;margin:0 auto;padding-block:18px 60px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
  .side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));display:grid;gap:14px}
  .mainc{display:grid;gap:18px;min-width:0}
  h2{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 8px;
    display:flex;gap:10px;align-items:center;color:var(--ink)}
  h2::after{content:"";flex:1;height:1px;background:var(--ink)}
  h2 small{font-family:var(--mono);font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--ink-faint);font-size:12px;order:2}

  /* decision slip */
  .slip{background:var(--memo);border-left:5px solid var(--stamp);box-shadow:3px 3px 0 var(--line-soft);padding:14px 16px 16px}
  .slip .who{font-family:var(--mono);font-size:12px;color:var(--stamp);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}
  .slip .q{font-family:var(--label);font-weight:700;font-size:21px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
  .slip .hint{margin:0 0 12px;color:var(--ink-dim);font-size:14px}
  .opts{display:flex;flex-wrap:wrap;gap:7px}
  .opt{background:var(--paper);border:1.5px solid var(--ink);padding:7px 12px;font-family:var(--label);font-weight:600;font-size:15px;
    letter-spacing:.03em;display:inline-flex;align-items:center;gap:7px;text-align:left}
  .opt:hover{background:var(--ink);color:var(--paper)}
  .opt.pass{border-style:dashed;color:var(--ink-dim)}
  .opt.pass:hover,.opt.pass:focus-visible{color:var(--paper)}   /* dashed buttons turn light on the dark hover too */
  .opt .chip{width:9px;height:9px;flex:none;background:var(--c,var(--ink-faint))}
  .slip.over{border-left-color:var(--ink)}
  /* phase strip: the three steps of a round, the current one filled */
  .phases{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));border:1.5px solid var(--ink);background:var(--paper);margin-bottom:-6px}
  .phases span{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;text-align:center;
    padding:6px 8px;color:var(--ink-faint);border-left:1px solid var(--line)}
  .phases .lbl{border-left:0;color:var(--ink);background:var(--manila);font-family:var(--mono);letter-spacing:.02em;text-transform:none}
  .phases .done{color:var(--ink-dim);text-decoration:line-through;text-decoration-thickness:1px}
  .phases .on{background:var(--ink);color:var(--paper)}
  .phases .wide{grid-column:span 3}
  /* dispatches: what happened, one player's turn at a time */
  .slip.dispatch{border-left-color:var(--ink);background:var(--paper)}
  .slip.dispatch .q{font-size:22px}
  .events{margin:0 0 12px;padding-left:18px;font-size:14.5px;color:var(--ink-dim);display:grid;gap:3px}
  .events li::marker{color:var(--stamp)}
  .slip .keys{margin:10px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
  .cardref{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help;border-radius:2px}
  .cardref:hover,.cardref:focus-visible{background:var(--memo);outline:none}
  .tag.cardref{text-decoration:none}   /* board tags already look like cards: no underline */
  #cardtip{position:fixed;z-index:60;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(27,28,25,.28))}
  #cardtip .card{width:170px;min-height:236px}
  .city.hot{background:var(--memo);box-shadow:inset 0 0 0 2px var(--stamp)}
  .tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .err{background:var(--paper);border:2px solid var(--stamp);padding:10px 12px;color:var(--stamp);font-family:var(--mono);font-size:13px}

  /* log */
  .log{background:var(--paper);border:1px solid var(--line-soft);max-height:44vh;overflow-y:auto;min-height:160px;padding:6px 0;font-family:var(--mono);font-size:12.5px}
  .log p{margin:0;padding:3px 12px;color:var(--ink-faint);border-left:3px solid transparent}
  .log p.new{color:var(--ink);border-left-color:var(--stamp);background:var(--paper-2)}
  .log p.rnd{color:var(--ink);font-weight:700;padding-top:8px}
  .log b{color:var(--stamp);font-weight:700}
  .log p.mine{color:var(--ink);font-style:italic}
  .log p.mine::before{content:"Only you: ";font-style:normal;font-weight:700;color:var(--stamp)}

  /* map */
  /* same columns and gaps as the player boards below, each continent its own box; empty columns stay empty */
  .map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .cont{background:var(--paper);padding:10px 10px 12px;border:1px solid var(--line-soft);border-top:4px solid var(--pc);min-width:0}
  .cont.dead{opacity:.55}
  .cont header{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-bottom:6px}
  .cont h3{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;margin:0;text-transform:uppercase;color:var(--pc)}
  .cont .pop{font-family:var(--mono);font-size:13px;color:var(--ink-dim)}
  .cont .pop b{color:var(--ink);font-size:16px}
  .you{font-family:var(--label);font-weight:700;font-size:11px;letter-spacing:.14em;background:var(--ink);color:var(--paper);padding:2px 6px;margin-left:8px;vertical-align:4px}
  /* four continents side by side: name on one line, then the solid starting row, then the dashed growth row
     (the grid has one column per starting spot, so the growth spots wrap onto their own line) */
  .cities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
  .cities.one{grid-template-columns:minmax(0,1fr)}   /* a continent with a city wider than 6 spots (Asia) keeps one column */
  /* right-hand column mirrors the left: name, then number on the outside edge, spots right-aligned */
  @media (min-width:521px){
    .cities:not(.one) .city:nth-child(2n){grid-template-columns:minmax(0,1fr) 18px}
    .cities:not(.one) .city:nth-child(2n) .no{order:2}
    .cities:not(.one) .city:nth-child(2n) .nm{order:1;text-align:right}
    .cities:not(.one) .city:nth-child(2n) .spots{order:3;justify-content:end}
  }
  .city{display:grid;grid-template-columns:18px minmax(0,1fr);gap:3px 6px;align-items:center;padding:5px 0;border-top:1px dashed var(--line-soft)}
  .city .no{font-family:var(--display);font-weight:800;color:var(--pc);font-size:16px;text-align:center}
  .city .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .city.crater .nm{text-decoration:line-through;color:var(--ink-faint)}
  .spots{grid-column:1 / -1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,13px));gap:2px}
  .spots i{aspect-ratio:1;border:1.5px solid var(--ink-faint);background:var(--paper);min-width:0}
  .spots i.grow{border-style:dashed;border-color:var(--line)}
  .spots i.cube{background:var(--pc);border-color:var(--pc)}
  .spots i.fall{background:repeating-linear-gradient(45deg,var(--fallout) 0 2px,var(--paper) 2px 4px);border-color:var(--fallout)}
  .city.pick{background:var(--memo);cursor:pointer;outline:2px solid var(--stamp);outline-offset:-1px}
  .city.pick:hover{background:var(--manila)}
  .crt{font-family:var(--label);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--stamp);margin-left:4px}

  /* boards */
  .boards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .board{background:var(--paper);border:1px solid var(--line-soft);border-left:5px solid var(--pc);padding:10px 10px 12px;min-width:0;display:flex;flex-direction:column;gap:6px}
  /* whose turn it is in the reveal phase: thick border in their colour, lifted, with a flag */
  /* Launchpad strip at the foot of each board */
  /* margin-top:auto pins the strip to the foot of the board, so all four line up in one row */
  .padstrip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
  .plabel{font-family:var(--label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px;color:var(--ink-faint);width:100%}
  .pslots{display:flex;gap:6px}
  .pslot{width:74px;height:42px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 4px;
    font-family:var(--label);font-weight:700;font-size:11.5px;line-height:1.1;letter-spacing:.06em;text-transform:uppercase}
  .pslot.empty{border:1.5px dashed var(--line);color:var(--ink-faint);font-weight:500}
  .pslot.down{background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);
    background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.07) 6px 12px)}
  .pslot.down.seen{color:var(--memo)}
  .pslot.mine{background:#fff;border:2px solid var(--c);color:var(--ink);text-transform:none;letter-spacing:.02em;text-decoration:none}
  .paim{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
  .padstrip.loaded .plabel{color:var(--stamp)}
  .board.turn{border:5px solid var(--pc);transform:translateY(-3px)}   /* same width on every side */
  .turnflag{font-family:var(--label);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:var(--pc);color:var(--paper);padding:2px 7px}
  @media (prefers-reduced-motion:no-preference){.board{transition:transform .15s ease,box-shadow .15s ease}}
  .board h4{margin:0;font-family:var(--label);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .board h4 .tok{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;background:var(--manila);padding:1px 6px}
  .trait{font-size:13px;color:var(--ink-dim);margin:0}
  .trait b{color:var(--ink)}
  .slots{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13.5px;margin:0}
  .slots dt{font-family:var(--label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px;color:var(--ink-faint);padding-top:2px}
  .slots dd{margin:0;min-width:0}
  .fd{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--paper);padding:0 6px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--ink)}
  .fd.wait{background:transparent;color:var(--ink-faint);border:1px dashed var(--ink-faint)}
  .fd.open{background:transparent;color:var(--stamp);border-color:var(--stamp)}
  .seen{font-family:var(--mono);font-size:12px;color:var(--stamp)}
  .tag{display:inline-block;font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.04em;padding:0 6px;margin:0 3px 3px 0;
    border:1px solid var(--c,var(--line));color:var(--ink)}
  .tag.used{opacity:.5;text-decoration:line-through}

  /* cards */
  .hand{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}   /* 7 cards per row */
  .card{width:150px;min-height:212px;max-width:100%;background:#fff;border:3px solid var(--rc);display:flex;flex-direction:column;text-align:center;padding:8px 8px 6px;box-shadow:0 1px 3px rgba(27,28,25,.22)}
  .card .nm{font-family:var(--cardname);font-size:13px;text-transform:uppercase;line-height:1.1;border-bottom:1px solid #aaaaa5;padding-bottom:5px;margin:0 0 6px}
  .card .st{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
  .card .st span{border:1.5px solid var(--ink);padding:1px 6px;font-weight:700;font-size:18px;line-height:1.1;display:flex;flex-direction:column;min-width:44px}
  .card .st span small{font-size:8px;font-weight:600;letter-spacing:.06em}
  .card .st span.clk{border-color:var(--stamp);color:var(--stamp)}
  .card .tx{font-size:11.5px;line-height:1.25;margin:0;flex:1}
  .card .ft{font-family:var(--label);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rc);border-top:1px solid #aaaaa5;padding-top:4px;margin-top:6px}
  .empty{font-family:var(--mono);font-size:13px;color:var(--ink-faint);margin:0}

  /* setup */
  .setup{display:grid;gap:12px}
  .setup .row{display:flex;flex-wrap:wrap;gap:7px}
  .setup .opt.start{background:var(--stamp);border-color:var(--stamp);color:var(--paper)}   /* the action, not an option */
  .setup .opt.start:hover{background:var(--ink);border-color:var(--ink)}
  .setup .opt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .setup label{font-family:var(--label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--ink-faint)}
  .botpicks{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
  .botrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
  .botpicks select{min-width:0}
  .botpicks select:disabled{opacity:.4}
  .setup .opt.start:disabled{opacity:.4;cursor:not-allowed;background:var(--stamp)}
  .botpicks select{font-family:var(--label);font-weight:600;font-size:15px;padding:6px 8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink)}
  .botblurbs{font-size:13px;line-height:1.4}
  .botname{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink-dim);border:1px solid var(--line);padding:0 5px;cursor:help}
  .result{display:grid;gap:4px;font-family:var(--mono);font-size:13px;margin:6px 0 12px}
  .result div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
  .result .w{color:var(--stamp);font-weight:700}

  @media (max-width:980px){
    .boards,.map{grid-template-columns:repeat(2,minmax(0,1fr))}
    .wrap{grid-template-columns:minmax(0,1fr)}
    .side{position:static;order:-1}
    .log{max-height:240px}
    .hand{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  @media (max-width:520px){
    .boards{grid-template-columns:minmax(0,1fr)}
    .map{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cities{grid-template-columns:minmax(0,1fr)}
    .hand{grid-template-columns:repeat(2,minmax(0,1fr))}
    .mark{font-size:22px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
