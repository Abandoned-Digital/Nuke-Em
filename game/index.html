<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuke'em</title>
<style>
:root{--ink:#e6edf3;--dim:#7d8fa1;--line:#1d3346;--panel:rgba(6,12,18,.82);--hot:#ff5a3c;--teal:#2ee6c8;
  --ui:Bahnschrift,'Arial Narrow','Segoe UI',sans-serif;--stencil:Stencil,Impact,Bahnschrift,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04070b;color:var(--ink);font-family:var(--ui);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#crt{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
button{font:600 13px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:rgba(20,40,58,.6);
  border:1px solid #2a4a66;padding:8px 12px;cursor:pointer;border-radius:2px}
button:hover{border-color:var(--teal);color:#fff}
button.on{background:var(--teal);color:#03231e;border-color:var(--teal)}
button.alt{background:transparent;border-color:var(--teal);color:var(--teal)}

/* ---- the table: a 1600 x 1000 layout, scaled to the window by main.ts ---- */
#table{position:fixed;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0;z-index:6;pointer-events:none}
#table > *{pointer-events:auto}
#mapzone{position:absolute;left:176px;top:174px;width:1248px;height:656px;pointer-events:none}
/* the bands the seats sit on */
.band{position:absolute;pointer-events:none;background:#060c12}
.band.top{left:0;right:0;top:0;height:170px;border-bottom:1px solid var(--line)}
.band.bottom{left:0;right:0;bottom:0;height:168px;border-top:1px solid var(--line)}
.band.left{left:0;top:170px;bottom:168px;width:174px;border-right:1px solid var(--line)}
.band.right{right:0;top:170px;bottom:168px;width:174px;border-left:1px solid var(--line)}

/* card in a slot: drawn at 210 x 294 and scaled */
.cw{position:absolute;left:0;top:0;width:210px;height:294px;transform-origin:0 0;transform:scale(var(--k,.4));pointer-events:none}
.box{position:relative;border:1px dashed #2a3b4c;border-radius:5px}
.sl .cap{font:600 9.5px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:#56708a;text-align:center;white-space:nowrap}
.st{position:absolute;left:calc(var(--i,0) * 9px);top:calc(var(--i,0) * 7px);width:100%;height:100%}
.st.used{opacity:.4;filter:grayscale(.7)}
.cw.armed{filter:drop-shadow(0 0 6px rgba(255,77,58,.7))}
.cw.armed .cbk{border-color:#ff4d3a;background:repeating-linear-gradient(45deg,#3a1410 0 10px,#4c1c16 10px 20px);color:#ff9a8a}
.cw.mine{filter:drop-shadow(0 0 8px var(--c))}
.seen{position:absolute;left:4px;top:4px;font:700 9px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:2px 4px;background:#ff4d3a;color:#1a0500;border-radius:2px}
.seen.decoy{background:#9aa7b4}
.seen.mine{left:auto;right:4px;top:auto;bottom:4px;background:rgba(5,8,12,.85);color:var(--ink);border:1px solid #56708a}
.st.pick{cursor:pointer;z-index:4}
.st.pick .cw{outline:6px solid #fff;outline-offset:3px;border-radius:12px;animation:pickpulse 1.1s ease-in-out infinite}
.seat.pick{cursor:pointer}
.seat.pick .nm{box-shadow:0 0 0 2px #fff,0 0 22px -2px #fff;animation:pickpulse 1.1s ease-in-out infinite}
.note{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:600 10px/1.2 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:#56708a}
.note small{font-size:8px;letter-spacing:.06em;color:#3d5266;margin-top:3px}
[data-def],[data-act]{pointer-events:auto}

/* bots: top seats in a row, side seats in a column with their cards lying sideways, bottoms towards the map */
.seat{position:absolute;transition:opacity .4s,filter .4s}
.seat.dead,.seat.empty{opacity:.28;filter:grayscale(1)}
.seat.empty .nm b{color:#56708a}
.seat.bot{display:flex;flex-direction:column}
.seat.bot .nm{order:-1}
.seat.bot .row{display:flex;gap:8px;align-items:flex-start}
.seat.bot .box{width:84px;height:118px}
.seat.bot .sl{display:flex;flex-direction:column;gap:4px}
.seat.topL{left:25px;top:4px}
.seat.topR{right:25px;top:4px}
.seat.topR .row{flex-direction:row-reverse}
.seat.bot .stack{position:relative;width:calc(84px + 5 * 20px);height:118px}
.seat.bot .stack .hc{position:absolute;top:0;left:calc(var(--i) * 20px)}
.seat.topR .stack .hc{left:auto;right:calc(var(--i) * 20px)}
/* top seats: the hand fills the room from the Action card to the frame, its cards centred in it */
.seat.topL .stack,.seat.topR .stack{width:204px}
.seat.topL .stack{margin:0 -12px 0 -8px}
.seat.topR .stack{margin:0 -8px 0 -12px}
.seat.topL .stack .hc{left:calc((204px - ((var(--n) - 1) * 20px + 84px)) / 2 + var(--i) * 20px)}
.seat.topR .stack .hc{right:calc((204px - ((var(--n) - 1) * 20px + 84px)) / 2 + var(--i) * 20px)}
.seat.bot .stack .hc{width:84px;height:118px}
.seat.bot .stack .hc .cw{--k:.4;box-shadow:-3px 0 6px rgba(0,0,0,.5);border-radius:10px}
.cnt{position:absolute;bottom:-14px;left:0;font:400 13px/1 var(--stencil);color:var(--dim);font-style:normal}
.seat.topL .cnt{left:calc(50% + 31px)}
.seat.topR .cnt{left:auto;right:calc(50% - 47px)}
.seat.topL .cnt,.seat.topR .cnt{z-index:1;background:#060c12;padding:0 4px}
/* side seats: the name band along the outer edge, then the cards; the slot names sit on the frame's inner line */
.seat.left,.seat.right{top:170px;height:662px;width:164px;flex-direction:row;align-items:center}
.seat.left{left:0;justify-content:flex-start}
.seat.right{right:0;justify-content:flex-end}
.seat.left .row{margin-left:31px}
.seat.right .row{margin-right:31px}
.seat.left .nm,.seat.right .nm{position:absolute;top:50%;writing-mode:vertical-rl;width:auto;margin:0;padding:8px 2px;border:0;flex-wrap:nowrap;gap:8px;max-height:640px}
.seat.left .nm{left:14px;transform:translate(-50%,-50%) rotate(180deg)}
.seat.right .nm{right:14px;transform:translate(50%,-50%)}
.seat.left .nm .dot,.seat.right .nm .dot{width:9px;height:9px}
.seat.left .row,.seat.right .row{flex-direction:column-reverse;gap:4px;align-items:center}
.seat.left .sl,.seat.right .sl{position:relative}
.seat.left .box,.seat.right .box{width:118px;height:84px}
.seat.left .sl .cap,.seat.right .sl .cap{position:absolute;top:50%;z-index:1;writing-mode:vertical-rl;font-size:8.5px;letter-spacing:.14em;background:#060c12;padding:5px 0}
.seat.left .sl .cap{left:100%;margin-left:4.5px;transform:translateY(-50%) rotate(180deg)}
.seat.right .sl .cap{right:100%;margin-right:4.5px;transform:translateY(-50%)}
/* lying sideways: the 210 x 294 card turned a quarter into a 118 x 84 box, its bottom towards the map */
.seat.left .box .cw,.seat.left .stack .hc .cw{transform:translate(0,84px) rotate(-90deg) scale(.4)}
.seat.right .box .cw,.seat.right .stack .hc .cw{transform:translate(118px,0) rotate(90deg) scale(.4)}
.seat.left .stack,.seat.right .stack{width:118px;height:calc(84px + 5 * 10px)}
.seat.left .stack .hc,.seat.right .stack .hc{position:absolute;left:0;top:calc(var(--i) * 10px);width:118px;height:84px}
.seat.left .stack .hc .cw,.seat.right .stack .hc .cw{box-shadow:0 -3px 6px rgba(0,0,0,.5)}
.seat.left .cnt{bottom:auto;top:-18px;left:50%;transform:translateX(-50%)}
.seat.right .cnt{bottom:auto;top:-18px;left:50%;right:auto;transform:translateX(-50%)}
/* name bands above the cards */
.nm{display:flex;align-items:center;gap:7px;white-space:nowrap;margin:0 0 5px;padding:3px 8px;border-left:4px solid var(--c,#56708a);background:rgba(10,20,30,.85);cursor:pointer;max-width:100%;overflow:hidden}
.seat.topL .nm,.seat.topR .nm{width:fit-content;align-self:center}
.seat.topR .nm{flex-direction:row-reverse;border-left:0;border-right:4px solid var(--c)}
.nm .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.nm b{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.nm span{color:var(--dim);font-size:12px}
.nm .pv{font-style:normal;font-size:12px;color:var(--ink);letter-spacing:.04em}
.tok{font-style:normal;font-size:10px;letter-spacing:.12em;padding:2px 5px;color:transparent;border:1px solid transparent;text-transform:uppercase}
.tok.on{color:#1a1200;background:#f2c94c;border-color:#f2c94c}
/* not the first player: the tag takes no room, so the name line has no gap */
.tok:not(.on):not(.land){display:none}
.tok.land{visibility:hidden}
/* every player's board is framed in its continent's colour; the one whose turn it is (or who is playing a card) lights up */
.seat::before{content:"";position:absolute;inset:14px -12px 4px;border:2px solid color-mix(in srgb,var(--c,#56708a) 38%,transparent);border-radius:10px;pointer-events:none;transition:border-color .3s,box-shadow .3s}
.seat.left::before{inset:6px 5px 6px 13px}
.seat.right::before{inset:6px 13px 6px 5px}
.seat.bottom::before{inset:11px 13px 6px}
/* the frame line runs behind the slot names and name bands, like a form's legend */
.seat.bottom .sl .cap{position:relative;z-index:1;align-self:center;background:#060c12;padding:0 6px}
.seat.topL .sl .cap,.seat.topR .sl .cap{position:relative;z-index:1;align-self:center;background:#060c12;padding:0 5px}
.seat.topL .nm,.seat.topR .nm{position:relative;z-index:1}
.seat.left .nm,.seat.right .nm{z-index:1}
/* the player names sit on the frame line too: plain text on a patch of the band colour, no box */
.seat.bot .nm{background:#060c12;border:0}
.seat.topL .nm,.seat.topR .nm{margin:3px 0 2px;padding:3px 8px}
/* one HAND label per hand, on the frame line in the middle of the hand */
.handrow::after,.seat.bot .stack::after{content:"Hand";position:absolute;z-index:1;font:600 9.5px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:#56708a;background:#060c12;white-space:nowrap;pointer-events:none}
.handrow::after{top:-13px;left:256px;transform:translateX(-50%);padding:0 6px}
.seat.topL .stack::after,.seat.topR .stack::after{bottom:-13.5px;left:50%;transform:translateX(-50%);padding:0 5px}
.seat.left .stack::after,.seat.right .stack::after{top:50%;writing-mode:vertical-rl;font-size:8.5px;letter-spacing:.14em;padding:5px 0}
.seat.left .stack::after{left:100%;margin-left:4.5px;transform:translateY(-50%) rotate(180deg)}
.seat.right .stack::after{right:100%;margin-right:4.5px;transform:translateY(-50%)}
/* the lit frame keeps its glow tight to the line, so the name patches on it don't show as dark boxes */
.seat.acting::before,.seat.speak::before,.seat.think::before{border-color:var(--c);box-shadow:0 0 7px -2px var(--c),inset 0 0 7px -2px var(--c)}
.seat.acting .s-slot .box,.seat.speak .s-slot .box,.seat.think .s-slot .box{border-color:var(--c);box-shadow:0 0 16px -2px var(--c)}

/* you, at the bottom */
.seat.bottom{left:0;right:0;bottom:0;height:168px}
.seat.bottom .box{width:96px;height:134px;--k:.457}
.seat.bottom .sl{position:absolute;top:7px;display:flex;flex-direction:column-reverse;gap:4px}
.seat.bottom .s-slot{left:1062px}.seat.bottom .s-lock{left:1162px}.seat.bottom .s-pad{left:1262px}.seat.bottom .s-shl{left:1362px}.seat.bottom .s-upg{left:1479px}
.seat.bottom .box .cw{--k:.457}
.handrow{position:absolute;left:25px;top:20px;width:520px;height:134px}
.handrow .hc{position:absolute;top:0;left:calc(var(--i) * min(104px, 424px / (var(--n) - 1)));width:96px;height:134px;border-radius:6px;transition:transform .15s}
.handrow .hc .cw{--k:.457}
.handrow .hc.ghost{border:1px dashed #22374a}
.handrow .hc.face:hover{z-index:5}
.handrow .hc.pick{cursor:pointer;z-index:3}
.handrow .hc.pick .cw{outline:6px solid #fff;outline-offset:4px;border-radius:12px;animation:pickpulse 1.1s ease-in-out infinite}
.handrow .hc.dim{opacity:.45}
@keyframes pickpulse{50%{outline-color:rgba(255,255,255,.3)}}
.tok.big{position:absolute;left:18px;top:2px;font-size:9px}
/* your actions: one line each, lit when you can plan them */
.actlist{position:absolute;top:20px;width:140px;display:flex;flex-direction:column;gap:4px}
.actlist.L{left:554px}
.actlist.R{left:898px}
.actlist .ao{position:relative;height:42px;display:flex;align-items:center;gap:9px;padding:0 10px;border:1px solid #22374a;border-left:4px solid #22374a;background:rgba(10,20,30,.7);
  font:600 13px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#56708a;white-space:nowrap;overflow:hidden}
.actlist .ao svg{width:18px;height:18px;fill:currentColor;stroke:currentColor;stroke-width:1.2;flex:none}
.actlist .ao em{position:absolute;right:6px;bottom:4px;font-style:normal;font-size:8.5px;letter-spacing:.12em}
.actlist .ao.ok{color:var(--ink);border-color:#3a5670;border-left-color:var(--k);cursor:pointer;background:rgba(20,40,58,.85)}
.actlist .ao.ok svg{color:var(--k)}
.actlist .ao.ok:hover{border-color:var(--k);box-shadow:0 0 14px -4px var(--k)}
/* while you plan, the actions you can pick breathe gently in their own colour */
.actlist.planning .ao.ok:not(.sel)::after{content:"";position:absolute;inset:-2px;border:2px solid var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);box-shadow:0 0 20px -2px var(--k),inset 0 0 12px -4px var(--k);pointer-events:none;opacity:.15;animation:aoglow 1.6s ease-in-out infinite}
/* only the glow's opacity changes: nothing repaints, so the buttons around it neither flicker nor shift */
@keyframes aoglow{50%{opacity:1}}
.actlist .ao.sel{background:var(--k);color:#05080c;border-color:var(--k);box-shadow:0 0 20px -4px var(--k)}
.actlist .ao.sel svg{color:#05080c}
.actlist .ao.plan{color:var(--ink);border-left-color:var(--k)}
.actlist .ao.lock{color:#ff8a6a}
/* a player's trait, in a window you close */
#info{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(2,5,8,.55)}
#info.on{display:flex}
#info .ibox{width:min(420px,90vw);padding:18px 20px 18px;background:rgba(6,12,18,.98);border:1px solid #2a4a66;border-top:4px solid var(--c);box-shadow:0 20px 50px rgba(0,0,0,.7)}
#info .ic{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--c)}
#info h2{margin:6px 0 8px;font:400 26px/1.05 var(--stencil);letter-spacing:.04em;text-transform:uppercase}
#info p{margin:0 0 14px;font-size:15px;line-height:1.4;color:#c6d2de}
#info .res table{width:100%;border-collapse:collapse;margin:4px 0 12px}
#info .res td{padding:7px 6px;border-top:1px solid #1d3346;font-size:15px;color:#c6d2de}
#info .res td i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
#info .res td small{display:block;margin-left:18px;font-size:11px;letter-spacing:.06em;color:#7d8fa1}
#info .res .rk{width:22px;color:#7d8fa1;font:400 18px/1 var(--stencil)}
#info .res .cs{font-size:12px;color:#7d8fa1;text-align:right}
#info .res .sc{width:44px;text-align:right;font:400 24px/1 var(--stencil);color:#e6edf3}
#info .res tr.win td{color:#fff}
#info .res tr.win .sc{color:var(--c)}
#info .res tr.out td{opacity:.45}
#info .res .why{font-size:12px;color:#7d8fa1;margin:0 0 12px}
.nm[data-trait]{cursor:pointer}
#core .ringtxt{cursor:pointer;pointer-events:auto}

/* the round button in the middle of your side */
#core{position:absolute;left:688px;top:758px;width:224px;height:224px;pointer-events:none}
#core svg{position:absolute;inset:0;width:224px;height:224px;overflow:visible}
#core .ringtxt{font:600 13px var(--ui);letter-spacing:.3em;fill:var(--c,#e6edf3)}
#core .ringtxt .who{fill:#7d8fa1}
#go-btn{position:absolute;left:28px;top:28px;width:168px;height:168px;border-radius:50%;pointer-events:auto;padding:6px 16px 0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;
  background:radial-gradient(circle at 50% 38%,#26384a,#0d1824 70%);border:2px solid #3a5670;color:var(--ink);box-shadow:0 0 0 6px rgba(4,8,12,.8),0 0 30px -6px #000}
#go-btn b{font:400 22px/1.02 var(--stencil);letter-spacing:.04em;white-space:pre-line}
#go-btn small{font:600 10px/1.2 var(--ui);letter-spacing:.18em;color:var(--dim)}
#go-btn.ready{background:radial-gradient(circle at 50% 38%,#3cf0d0,#0f8f7c 75%);border-color:#7ff7e3;color:#03231e;box-shadow:0 0 0 6px rgba(4,8,12,.8),0 0 40px -2px var(--teal);animation:corepulse 1.6s ease-in-out infinite}
#go-btn.ready small{color:#064a40}
#go-btn.tint{background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--k) 70%,#fff),color-mix(in srgb,var(--k) 75%,#000) 78%);border-color:color-mix(in srgb,var(--k) 60%,#fff);color:#05080c;box-shadow:0 0 0 6px rgba(4,8,12,.8),0 0 40px -2px var(--k);animation:none}
#go-btn.warn{background:radial-gradient(circle at 50% 38%,#ff7a5c,#9a2a18 75%);border-color:#ffb3a3;color:#1a0500;box-shadow:0 0 0 6px rgba(4,8,12,.8),0 0 40px -2px var(--hot)}
#go-btn.warn small{color:#3a0a00}
#go-btn:disabled{cursor:default}
/* a yes/no choice: the circle cut in two buttons, with what it is about in a band across the middle */
#go-split{position:absolute;left:28px;top:28px;width:168px;height:168px;border-radius:50%;overflow:hidden;display:none;flex-direction:column;pointer-events:auto;
  border:2px solid #7ff7e3;box-shadow:0 0 0 6px rgba(4,8,12,.8),0 0 40px -2px var(--teal)}
#go-split.on{display:flex}
#core.split #go-btn{visibility:hidden}
#go-split button{flex:1;border:0;margin:0;cursor:pointer;font:400 21px/1 var(--stencil);letter-spacing:.04em;text-transform:uppercase;transition:filter .15s}
#go-split button:hover{filter:brightness(1.18)}
#go-split .top{flex:1;padding-top:12px;background:radial-gradient(circle at 50% 90%,#3cf0d0,#0f8f7c 90%);color:#03231e}
#go-split .bot{padding-bottom:12px;background:radial-gradient(circle at 50% 10%,#26384a,#0d1824 90%);color:var(--ink)}
#go-split .mid{flex:none;white-space:pre-line;padding:8px 12px 6px;background:#05080c;color:#a9b8c7;font:600 9.5px/1.25 var(--ui);letter-spacing:.16em;text-transform:uppercase;text-align:center}
/* the population cubes you are placing, in your colour */
#go-cubes{display:flex;gap:5px}
#go-cubes:empty{display:none}
#go-cubes i{width:16px;height:16px;border-radius:2px;background:var(--q);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),0 0 0 1.5px rgba(5,8,12,.75)}
#go-btn:disabled:hover{border-color:#3a5670;color:var(--ink)}
@keyframes corepulse{50%{box-shadow:0 0 0 6px rgba(4,8,12,.8),0 0 14px -4px var(--teal)}}

/* the hint line just above the round button */
#hint{position:absolute;left:206px;bottom:174px;width:420px;display:none;text-align:left;padding:8px 14px 9px;
  background:rgba(6,12,18,.94);border:1px solid #2a4a66;border-top:3px solid var(--teal);box-shadow:0 12px 30px rgba(0,0,0,.6)}
#hint.on{display:block}
#hint.high{bottom:174px}
#hint .hq{font:400 19px/1.1 var(--stencil);letter-spacing:.04em;text-transform:uppercase}
#hint .hh{margin-top:3px;color:#a9b8c7;font-size:12.5px;line-height:1.3}
#hint .hx{display:flex;gap:8px;justify-content:flex-start;margin-top:8px;flex-wrap:wrap}

/* planning: the five action cards fanned above your Action slot */

/* cards to choose that aren't in your hand */
#tray{position:absolute;left:800px;bottom:300px;transform:translateX(-50%);display:none;gap:16px;padding:12px;background:rgba(6,12,18,.9);border:1px solid #2a4a66}
#tray.on{display:flex}
#tray .tc{position:relative;width:126px;height:176px;cursor:pointer}
#tray .tc .cw{--k:.6;border-radius:10px}
#tray .tc .cw{outline:6px solid #fff;outline-offset:3px;border-radius:12px;animation:pickpulse 1.1s ease-in-out infinite} /* every card here is a choice: they glow like playable hand cards */
#tray .tc:hover .cw{animation:none}

/* Doomsday Clock, top middle */
#clock{position:absolute;left:712px;top:2px;width:176px;height:176px;border-radius:50%;background:radial-gradient(circle,#0d1824 60%,#070d14);border:1px solid #22374a;box-shadow:0 0 0 5px rgba(4,8,12,.9)}
#clock svg{position:absolute;left:-1px;top:-1px;width:176px;height:176px;filter:drop-shadow(0 0 8px rgba(255,90,60,.25))}
#clock circle{fill:#41566b}
#clock circle.gone{fill:#1b2836}
#clock circle.red{fill:#7a2a20}
#clock circle.mid{fill:var(--hot)}
#clock circle.start{stroke:#aab;stroke-width:1.5}
#clock circle.now{fill:#fff;filter:drop-shadow(0 0 4px #fff)}
#clock circle.hub{fill:var(--ink)}
#hand{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;transform-origin:100px 100px;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1)}
.cnum{position:absolute;left:-1px;right:-1px;top:104px;text-align:center;pointer-events:none}
.cnum b{display:block;font:400 28px/1 var(--stencil)}
.cnum span{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
#clock.late .cnum b,#clock.late #hand{color:var(--hot);stroke:var(--hot)}
#clock.late svg{animation:pulse 1s infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 16px rgba(255,90,60,.8))}}
/* menu and log: two small round icons at the clock's lower corners */
.pill{position:absolute;top:130px;width:32px;height:32px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,20,30,.92);color:var(--dim)}
.pill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#menu-btn{left:688px}
#log-btn{left:880px}
#log-btn.on{background:var(--teal);color:#03231e}
#dbg-btn{left:880px;top:18px}
#dbg-btn.on{background:#ff9f40;color:#2a1300}
/* debug launchers, in the empty sea off the Americas */
#debug{position:absolute;left:184px;top:496px;width:214px;display:none;flex-direction:column;gap:6px}
#debug.on{display:flex}
#debug select{width:100%;padding:6px 8px;font:600 11px/1 var(--ui);letter-spacing:.06em;color:#ffcf9a;background:rgba(40,20,4,.95);border:1px solid #ff9f40}
#debug .dbg-list{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:196px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#ff9f40 transparent}
#debug button{padding:7px 4px;font-size:10px;letter-spacing:.04em;border:1px solid #ff9f40;color:#ffcf9a;background:rgba(40,20,4,.85)}
#debug button:hover{background:#ff9f40;color:#2a1300}
#debug.busy button:not([data-snd]){opacity:.35;pointer-events:none}

/* decks, on the map's bottom right like the printed board */
#decks{position:absolute;left:1150px;top:662px;display:flex;gap:8px}
.deck{position:relative;width:72px;height:100px}
.deck > .cbk{width:210px;height:294px;transform:scale(.343);transform-origin:0 0;inset:auto;box-shadow:6px 6px 0 #0b1219,12px 12px 0 #0a1016}
.deck em{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .pile{position:absolute;inset:0;border:1px dashed #2a3b4c;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#3d5266}
.deck.discard em{top:0;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:4px;font-size:9px;line-height:1.15;color:#c6d2de;white-space:normal;overflow-wrap:normal;word-break:normal;hyphens:auto;overflow:hidden;text-align:center;text-transform:uppercase;letter-spacing:.02em}
.deck.discard:has(em:not(:empty)) .pile{color:transparent;border-style:solid;border-color:#3a5068;background:#0d1620}

/* the wire log: toggled, may cover the map */
#log{position:absolute;left:580px;top:230px;width:440px;height:470px;display:none;flex-direction:column;pointer-events:none;background:rgba(4,9,14,.95);border:1px solid #2a4a66;border-top:3px solid var(--teal);box-shadow:0 20px 50px rgba(0,0,0,.7)}
#log.on{display:flex}
#log h3{pointer-events:auto;margin:0;padding:10px 14px 8px;font:400 18px/1 var(--stencil);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
#log h3 button{padding:4px 8px;font-size:11px}
#ticker{flex:1;overflow:auto;padding:4px 14px 12px;font-size:12.5px;line-height:1.35}
#ticker p{margin:0 0 4px;color:var(--dim)}
#ticker p:before{content:"> ";color:#3a5a76}
#ticker p.me{color:#bfe9ff}
#ticker p.new{color:var(--ink)}
#ticker p.round{color:var(--teal);margin-top:8px}
#ticker .cref{pointer-events:auto;cursor:help;text-decoration:underline;text-decoration-color:#4a6a86;text-underline-offset:2px}
#ticker .cref:hover{color:#fff;text-decoration-color:var(--teal)}

/* menu */
#menu{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(2,5,8,.6)}
#menu.on{display:flex}
#menu .mbox{width:min(520px,92vw);padding:18px 20px 20px;background:rgba(6,12,18,.98);border:1px solid #2a4a66;border-top:4px solid var(--teal);box-shadow:0 20px 50px rgba(0,0,0,.7)}
#menu h2{margin:0 0 12px;font:400 26px/1 var(--stencil);letter-spacing:.06em}
#menu .mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
#menu .mrow > span{width:100%;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#menu input{flex:1;min-width:0;font:500 13px/1 ui-monospace,Consolas,monospace;color:var(--ink);background:#0c1822;border:1px solid #2a4a66;padding:9px 8px;border-radius:2px}
#menu .msg{font-size:12.5px;color:#a9b8c7;min-height:1em;margin:4px 0 0}
#menu a{color:var(--teal)}
#menu .close{float:right;margin-top:-4px}

/* card zoom on hover */
#zoom{position:fixed;z-index:9;width:231px;height:323px;pointer-events:none;display:none;filter:drop-shadow(0 18px 30px rgba(0,0,0,.8))}
#zoom.on{display:block}
#zoom .cw{--k:1.1}

#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.96);z-index:7;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  padding:14px 34px 16px;background:linear-gradient(90deg,transparent,rgba(4,8,12,.88) 18%,rgba(4,8,12,.88) 82%,transparent);border-top:2px solid var(--c);border-bottom:2px solid var(--c);min-width:420px}
#banner.show,#banner.stay{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner.big{top:42%}
#banner h2{margin:0;font:400 34px/1.1 var(--stencil);letter-spacing:.08em;color:var(--c);text-transform:uppercase;text-shadow:0 0 18px var(--c)}
#banner p{margin:6px 0 0;font-size:15px;letter-spacing:.16em;text-transform:uppercase}
#banner.big h2{font-size:58px}

/* card faces (drawn at 210 x 294 and scaled) */
.cf{position:absolute;inset:0;border-radius:10px;background:#0d1620;border:3px solid var(--k);color:var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden;
  box-shadow:inset 0 0 0 4px #0d1620,inset 0 0 0 5px color-mix(in srgb,var(--k) 40%,transparent)}
.cf .ck{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--k)}
.cf .cn{font:400 27px/1.05 var(--stencil);letter-spacing:.03em;text-transform:uppercase}
.cf .cx{font-size:14.5px;line-height:1.35;color:#c6d2de}
.cf .cst{display:flex;gap:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.cf .cst b{font:400 22px/1 var(--stencil);color:var(--k);margin-left:4px}
.cf.act{border-color:var(--b,var(--k));align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--k) 22%,#0d1620),#0d1620 70%)}
.cf.act .ico{width:120px;height:120px;fill:var(--k);stroke:var(--k);stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 0 14px var(--k))}
.cf.act .cn{font-size:25px;letter-spacing:0;color:var(--k)}
.cbk{position:absolute;inset:0;border-radius:10px;border:3px solid #6b7f93;background:repeating-linear-gradient(45deg,#16222e 0 10px,#1c2b3a 10px 20px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9fb3c8}
.cbk.propaganda b{font-size:25px;letter-spacing:0}
.cbk b{font:400 30px/1 var(--stencil);letter-spacing:.06em;text-transform:uppercase;padding:6px 0;border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.cbk.propaganda{border-color:#e0457b;color:#ff8fb5;background:repeating-linear-gradient(45deg,#2a1020 0 10px,#331427 10px 20px)}
.cbk.action{border-color:#8a9bb0;color:#c6d2de;background:repeating-linear-gradient(-45deg,#141c25 0 10px,#19232e 10px 20px)}
.cbk.action b{font-size:34px}

/* cards in motion */
#fly{position:fixed;inset:0;pointer-events:none;z-index:8;perspective:1400px}
.fly{position:fixed;transform-origin:0 0;will-change:transform;pointer-events:auto;cursor:pointer}
.flip{position:absolute;inset:0;transform-style:preserve-3d}
.flip.up{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.face.front{transform:rotateY(180deg)}
.fz{position:absolute;left:0;top:0;width:210px;height:294px;transform:scale(var(--fs,1));transform-origin:0 0}
.stamp{position:absolute;left:6%;right:6%;top:42%;text-align:center;font:400 26px/1 var(--stencil);letter-spacing:.04em;text-transform:uppercase;color:var(--s);
  border:4px solid var(--s);padding:6px 0;background:rgba(5,8,12,.75);transform:rotate(-14deg)}
.handhdr{background:none}
.whohdr{position:absolute;left:-6px;right:-6px;bottom:100%;margin-bottom:8px;padding:7px 10px 8px;background:var(--c);color:#05080c;border-radius:6px 6px 2px 2px;
  box-shadow:0 10px 26px rgba(0,0,0,.55);text-align:center;line-height:1.05}
.whohdr b{display:block;font:400 21px/1 var(--stencil);letter-spacing:.06em;text-transform:uppercase}
.whohdr span{display:block;margin-top:4px;font:700 11px/1.1 var(--ui);letter-spacing:.16em;text-transform:uppercase}
.tokfly{position:fixed;z-index:9;font-size:11px;letter-spacing:.12em;padding:1px 5px;color:#1a1200;background:#f2c94c;box-shadow:0 0 14px #f2c94c}

/* the news: a TV lower third over the map */
#news{position:absolute;left:800px;top:654px;transform:translate(-50%,0);display:none;width:760px;pointer-events:none}
#news.on{display:flex}
#news .tag{flex:none;display:flex;align-items:center;padding:0 18px;font:400 24px/1 var(--stencil);letter-spacing:.08em;text-transform:uppercase;background:#d7263d;color:#fff}
#news .tag.scandal{background:#ff9f40;color:#2a1300}
#news .tag.classified{background:#6a3fb5}
#news .body{flex:1;background:linear-gradient(90deg,#f1ece0,#e6dfcf);color:#14100a;padding:10px 16px 11px;border-bottom:4px solid var(--c);min-width:0}
#news .chan{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6a5d48}
#news .head{font:700 22px/1.15 Georgia,'Times New Roman',serif;margin:3px 0 4px}
#news .sub{font-size:12.5px;color:#4a4134;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nstamp{position:absolute;right:26px;top:-18px;font:400 30px/1 var(--stencil);letter-spacing:.1em;text-transform:uppercase;color:#d7263d;border:4px solid #d7263d;padding:4px 10px;background:rgba(241,236,224,.92)}

/* setup screen */
#title{position:fixed;inset:0;z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at center,rgba(4,8,12,.82),rgba(4,8,12,.97));transition:opacity .6s}
#title.gone{opacity:0;pointer-events:none}
#title h1{margin:0;font:400 min(16vw,150px)/1 var(--stencil);letter-spacing:.06em;text-shadow:0 0 40px rgba(255,90,60,.45)}
#title p{margin:0;color:var(--dim);letter-spacing:.3em;text-transform:uppercase;font-size:14px}
#title button{font-size:18px;padding:14px 28px;margin-top:14px;background:var(--hot);border-color:var(--hot);color:#1a0500}
#title .setup{display:flex;flex-direction:column;gap:8px;width:min(580px,92vw);margin-top:10px}
/* one grid for the whole form: everything below the rows lines up with the dropdowns (right of the seat numbers) */
#title .setup:not(.lobby):not(.home)>:not(.srow):not(.smode){margin-left:30px}
#title .setup:not(.lobby):not(.home)>.shint{margin-left:30px !important}
#title .smode{margin:0 0 4px 30px;font:400 22px/1 var(--stencil);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
#title .sname{display:flex;align-items:center;gap:12px}
#title .sname span{width:110px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
#title .sname input{flex:1;min-width:0;font:600 16px/1 var(--ui);color:var(--ink);background:#0c1822;border:1px solid #2a4a66;padding:11px 12px;border-radius:2px}
#title .sname input:focus{outline:none;border-color:var(--teal)}
#title .smodes{display:flex;gap:10px;margin-top:6px}
#title .smodes button{flex:1;margin:0;padding:14px 10px;font-size:16px}
#title .smodes button.alt{background:transparent;border-color:var(--teal);color:var(--teal)}
#title .home .scode{margin-top:18px}
#title .sfix{grid-column:2;font:600 14px/1 var(--ui);color:var(--ink);background:#0a141d;border:1px solid #1f3a52;padding:10px 8px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title .sfix.friend{color:var(--teal)}
.srow{display:grid;grid-template-columns:22px 1fr 1fr 100px 26px;gap:8px;align-items:center}
#title .setup .srm{width:26px;height:26px;min-width:0;margin:0;padding:0;font:400 18px/24px var(--ui);color:#9fb3c8;background:transparent;border:1px solid #2a4a66;box-shadow:none}
#title .setup .srm:hover{color:#ff5a3c;border-color:#ff5a3c;background:transparent}
#title .setup .sadd{margin-top:2px;padding:7px 14px;font-size:12px;letter-spacing:.08em;color:var(--teal);background:transparent;border:1px dashed var(--teal)}
#title .setup .sadd:hover{background:rgba(60,240,208,.1)}
#title .lobby h2{margin:0 0 10px;font:400 26px/1.1 var(--stencil);letter-spacing:.06em;text-align:center}
#title .lobby #lobby-link{flex:1;font-size:14px}
.sn{color:var(--dim);font:400 18px/1 var(--stencil)}
#title select{font:600 14px/1 var(--ui);color:var(--ink);background:#0c1822;border:1px solid #2a4a66;padding:9px 8px;border-radius:2px}
#title select:disabled{opacity:.35}
#title select option.sep{color:#e6edf3;background:#0c1822;letter-spacing:0}
#title select option.pad{font-size:6px;min-height:0}
.slen{display:flex;gap:6px;margin-top:6px}
.slen button{flex:1}
.shint{margin:4px 0 0 !important;letter-spacing:.04em !important;text-transform:none !important;font-size:13px !important;text-align:center}
.sgo{display:flex;gap:10px}
.sgo button{flex:1}
.sgo #go{flex:2}
#title .sgo button{margin-top:8px}
#title .slen button{background:transparent;border-color:#2a4a66;color:var(--dim);font-size:14px;padding:10px;margin:0}
#title .slen button.on{box-shadow:0 0 18px -6px var(--teal);background:var(--teal);border-color:var(--teal);color:#03231e}
#title .sgo button.alt{background:transparent;border-color:var(--teal);color:var(--teal)}
#title .sgo button:disabled{opacity:.4;cursor:not-allowed}
.scode{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.scode input{flex:1;min-width:0;font:500 13px/1 ui-monospace,Consolas,monospace;color:var(--ink);background:#0c1822;border:1px solid #2a4a66;padding:9px 8px;border-radius:2px}
#title .scode button{margin:0;font-size:14px;padding:9px 16px}
.shint.err{color:#ff8a6a !important;min-height:1em}
</style>
</head>
<body>
<div id="stage"></div>
<div id="table">
  <div class="band top"></div><div class="band left"></div><div class="band right"></div><div class="band bottom"></div>
  <div id="mapzone"></div>
  <div id="decks"><div class="deck" id="deck-build" data-deck="build"><div class="cbk build"><b>Build</b></div><em id="db-n"></em></div><div class="deck" id="deck-prop" data-deck="propaganda"><div class="cbk propaganda"><b>Propaganda</b></div><em id="dp-n"></em></div><div class="deck discard" id="deck-discard"><div class="pile">Discard</div><em id="dd-n"></em></div></div>
  <div id="seats"></div>
  <div id="clock"></div>
  <button id="menu-btn" class="pill" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button id="dbg-btn" class="pill" title="Debug: launch any weapon"><svg viewBox="0 0 24 24"><path d="M8 9a4 4 0 0 1 8 0v6a4 4 0 0 1-8 0zM12 9v10M4 12h4M16 12h4M5 6l3 2M19 6l-3 2M5 19l3-2M19 19l-3-2"/></svg></button>
  <div id="debug"></div>
  <button id="log-btn" class="pill" title="Wire log (L)"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 9h6M9 13h6M9 17h3"/></svg></button>
  <div id="news"></div>
  <div id="tray"></div>
  <div id="hint"></div>
  <div id="core"><svg viewBox="0 0 224 224"><defs><path id="arcTop" d="M 18 112 A 94 94 0 0 1 206 112"/><path id="arcBot" d="M 6 112 A 106 106 0 0 0 218 112"/></defs>
    <text class="ringtxt"><textPath href="#arcBot" startOffset="50%" text-anchor="middle"><tspan id="ringname"></tspan><tspan class="who" id="ringwho"></tspan></textPath></text></svg>
    <button id="go-btn" disabled><b id="go-label"></b><span id="go-cubes"></span><small id="go-small"></small></button>
    <div id="go-split"><button class="top" id="split-top"></button><div class="mid" id="split-mid"></div><button class="bot" id="split-bot"></button></div></div>
  <div id="log"><h3>Wire log <button id="log-close">Close</button></h3><div id="ticker"></div></div>
</div>
<div id="banner"></div>
<div id="zoom"></div>
<div id="menu"></div>
<div id="info"></div>
<div id="fly"></div>
<div id="crt"></div>
