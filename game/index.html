<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuke'em</title>
<style>
:root{--side:220px;--ink:#e6edf3;--dim:#7d8fa1;--line:#1d3346;--panel:rgba(6,12,18,.82);--hot:#ff5a3c;--teal:#2ee6c8;
  --ui:Bahnschrift,'Arial Narrow','Segoe UI',sans-serif;--stencil:Stencil,Impact,Bahnschrift,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04070b;color:var(--ink);font-family:var(--ui);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
/* CRT feel: scanlines and a vignette over everything, never catching the mouse */
#crt{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
button{font:600 13px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:rgba(20,40,58,.6);
  border:1px solid #2a4a66;padding:8px 12px;cursor:pointer;border-radius:2px}
button:hover{border-color:var(--teal);color:#fff}
button.on{background:var(--teal);color:#03231e;border-color:var(--teal)}

#top{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:20px;padding:0 18px;z-index:6;
  background:linear-gradient(180deg,rgba(4,8,12,.95),rgba(4,8,12,.55));border-bottom:1px solid var(--line)}
.brand{font:400 26px/1 var(--stencil);letter-spacing:.08em}
.brand span{font:600 11px/1 var(--ui);letter-spacing:.3em;color:var(--dim);margin-left:12px;vertical-align:middle}
#status{display:flex;gap:12px;align-items:baseline;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
#status span{color:var(--teal)}
#ctl{margin-left:auto;display:flex;gap:6px}
#ctl .gap{width:10px}

#sidebar{position:fixed;right:0;top:52px;bottom:182px;width:var(--side);z-index:5;background:linear-gradient(90deg,rgba(6,12,18,.55),rgba(6,12,18,.88));border-left:1px solid var(--line)}
#sidebar h3{position:absolute;left:14px;right:14px;margin:0;font:600 10px/1 var(--ui);letter-spacing:.28em;text-transform:uppercase;color:#3d5a76;border-bottom:1px solid var(--line);padding-bottom:5px}
#clock{position:fixed;right:calc((var(--side) - 150px) / 2);top:62px;width:150px;z-index:6;text-align:center}
#clock svg{width:150px;height:150px;display:block;filter:drop-shadow(0 0 8px rgba(255,90,60,.25))}
#clock circle{fill:#41566b}
#clock circle.gone{fill:#1b2836}
#clock circle.red{fill:#7a2a20}
#clock circle.mid{fill:var(--hot)}
#clock circle.start{stroke:#aab;stroke-width:1.5}
#clock circle.now{fill:#fff;filter:drop-shadow(0 0 4px #fff)}
#clock circle.hub{fill:var(--ink)}
#hand{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;transform-origin:100px 100px;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1)}
.cnum b{display:block;font:400 34px/1 var(--stencil);margin-top:-2px}
.cnum span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
#clock.late .cnum b,#clock.late #hand{color:var(--hot);stroke:var(--hot)}
#clock.late svg{animation:pulse 1s infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 16px rgba(255,90,60,.8))}}

#ticker{position:fixed;right:0;top:418px;bottom:190px;width:var(--side);z-index:6;font-size:12px;line-height:1.3;letter-spacing:.02em;pointer-events:none;padding:4px 12px 0 14px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#ticker p{margin:0 0 5px;color:var(--dim)}
body.step #ticker{bottom:250px}
/* step mode: the game waits here */
#next{position:fixed;right:8px;bottom:192px;width:calc(var(--side) - 16px);z-index:8;display:none;flex-direction:column;align-items:flex-start;gap:4px;
  padding:10px 14px 12px;text-align:left;font:400 18px/1.1 var(--stencil);letter-spacing:.04em;background:var(--teal);color:#03231e;border-color:var(--teal);
  box-shadow:0 0 24px -4px var(--teal);animation:nextpulse 1.6s ease-in-out infinite}
#next small{font:600 10px/1 var(--ui);letter-spacing:.24em}
#next.on{display:flex}
#next:hover{background:#5ff3da;color:#03231e}
@keyframes nextpulse{50%{box-shadow:0 0 6px -4px var(--teal)}}
#ticker p:before{content:"> ";color:#3a5a76}
#ticker p.new{color:var(--ink)}
#ticker p.new:after{content:"_";animation:blink .8s steps(1) infinite;color:var(--teal)}
@keyframes blink{50%{opacity:0}}

#banner{position:fixed;left:calc((100% - var(--side)) / 2);top:104px;transform:translate(-50%,-50%) scale(.96);z-index:7;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  padding:14px 34px 16px;background:linear-gradient(90deg,transparent,rgba(4,8,12,.88) 18%,rgba(4,8,12,.88) 82%,transparent);border-top:2px solid var(--c);border-bottom:2px solid var(--c);min-width:420px}
#banner.show,#banner.stay{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner.big{top:40%}
#banner h2{margin:0;font:400 34px/1.1 var(--stencil);letter-spacing:.08em;color:var(--c);text-transform:uppercase;text-shadow:0 0 18px var(--c)}
#banner p{margin:6px 0 0;font-size:15px;letter-spacing:.16em;text-transform:uppercase}
#banner.big h2{font-size:58px}

#players{position:fixed;left:0;right:0;bottom:0;height:182px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 14px 12px;z-index:6;
  background:linear-gradient(0deg,rgba(4,8,12,.97),rgba(4,8,12,.75));border-top:1px solid var(--line)}
.pl{position:relative;border:1px solid #1f3346;border-left:5px solid var(--c);background:var(--panel);padding:8px 64px 8px 12px;display:flex;flex-direction:column;gap:7px;transition:box-shadow .3s,border-color .3s;min-width:0}
.pl.acting,.pl.speak{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 26px -4px var(--c)}
.pl.dead{opacity:.4;filter:grayscale(1)}
.nm{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.nm b{font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.nm span{color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.tok{margin-left:auto;font-style:normal;font-size:11px;letter-spacing:.12em;border:1px solid transparent;padding:1px 5px;color:transparent}
.tok.on{color:#1a1200;background:#f2c94c;border-color:#f2c94c}
.pop{display:flex;align-items:center;gap:10px}
.pv{font:400 24px/1 var(--stencil);min-width:34px}
.ct{color:var(--dim);font-size:11px;letter-spacing:.1em;white-space:nowrap}
.bar{flex:1;height:8px;background:#122030}
.bar i{display:block;height:100%;background:var(--c);transition:width .6s}
.row{display:flex;align-items:center;gap:6px;font-size:13px;min-height:20px}
.k{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;min-width:70px}
.k.sp{margin-left:10px;min-width:0}
.cards{display:inline-flex;gap:3px;align-items:center}
.dim{color:#3d5266;font-size:12px}
i.cb{display:inline-block;width:13px;height:18px;border:1px solid #6b7f93;background:repeating-linear-gradient(45deg,#1c2c3c 0 3px,#24384c 3px 6px)}
i.cb.armed{border-color:#ff4d3a;background:repeating-linear-gradient(45deg,#3a1410 0 3px,#4c1c16 3px 6px);box-shadow:0 0 6px rgba(255,77,58,.6)}
i.sh{display:inline-block;width:16px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid #5cc8ff;box-shadow:0 0 8px #5cc8ff}
.ups{display:flex;flex-wrap:wrap;gap:4px;min-height:18px}
.up{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid #3fc1ae;color:#bdf3ea;background:rgba(63,193,174,.12)}
/* the action slot: one card, top right of the panel */
.slot{position:absolute;right:10px;top:10px;width:44px;height:62px;border:1px dashed #2a3b4c}
.slot > .sc{position:absolute;left:0;top:0;width:210px;height:294px;transform:scale(.2095);transform-origin:0 0}

/* card faces (drawn at 210 x 294 and scaled) */
.cf{position:absolute;inset:0;border-radius:10px;background:#0d1620;border:3px solid var(--k);color:var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden;
  box-shadow:inset 0 0 0 4px #0d1620,inset 0 0 0 5px color-mix(in srgb,var(--k) 40%,transparent)}
.cf .ck{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--k)}
.cf .cn{font:400 27px/1.05 var(--stencil);letter-spacing:.03em;text-transform:uppercase}
.cf .cx{font-size:14.5px;line-height:1.35;color:#c6d2de}
.cf .cst{display:flex;gap:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.cf .cst b{font:400 22px/1 var(--stencil);color:var(--k);margin-left:4px}
.cf.act{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--k) 22%,#0d1620),#0d1620 70%)}
.cf.act .ico{width:120px;height:120px;fill:var(--k);stroke:var(--k);stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 0 14px var(--k))}
.cf.act .cn{font-size:30px;color:var(--k)}
.cbk{position:absolute;inset:0;border-radius:10px;border:3px solid #6b7f93;background:repeating-linear-gradient(45deg,#16222e 0 10px,#1c2b3a 10px 20px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9fb3c8}
.cbk span{font-size:13px;letter-spacing:.3em}
.cbk b{font:400 30px/1 var(--stencil);letter-spacing:.06em;text-transform:uppercase;padding:6px 0;border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.cbk.propaganda{border-color:#e0457b;color:#ff8fb5;background:repeating-linear-gradient(45deg,#2a1020 0 10px,#331427 10px 20px)}
.cbk.action{border-color:#8a9bb0;color:#c6d2de;background:repeating-linear-gradient(-45deg,#141c25 0 10px,#19232e 10px 20px)}
.cbk.action b{font-size:34px}

/* decks: bottom right of the map */
#decks{position:fixed;right:calc((var(--side) - 194px) / 2);top:290px;display:flex;gap:10px;z-index:6}
.deck{position:relative;width:58px;height:81px}
.deck > .cbk{width:210px;height:294px;transform:scale(.276);transform-origin:0 0;inset:auto;box-shadow:6px 6px 0 #0b1219,12px 12px 0 #0a1016}
.deck em{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck.discard{width:58px}
.deck .pile{position:absolute;inset:0;border:1px dashed #2a3b4c;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#3d5266}
.deck.discard em{top:0;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:3px;font-size:9px;line-height:1.15;color:#c6d2de;white-space:normal;overflow-wrap:anywhere;overflow:hidden;text-align:center;text-transform:uppercase;letter-spacing:.06em}
.deck.discard:has(em:not(:empty)) .pile{color:transparent;border-style:solid;border-color:#3a5068;background:#0d1620}

/* cards in motion */
#fly{position:fixed;inset:0;pointer-events:none;z-index:8;perspective:1400px}
.fly{position:fixed;transform-origin:0 0;will-change:transform}
.flip{position:absolute;inset:0;transform-style:preserve-3d}
.flip.up{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.face.front{transform:rotateY(180deg)}
.stamp{position:absolute;left:6%;right:6%;top:42%;text-align:center;font:400 26px/1 var(--stencil);letter-spacing:.04em;text-transform:uppercase;color:var(--s);
  border:4px solid var(--s);padding:6px 0;background:rgba(5,8,12,.75);transform:rotate(-14deg)}
/* whose card is on show */
.whohdr{position:absolute;left:-6px;right:-6px;bottom:100%;margin-bottom:8px;padding:7px 10px 8px;background:var(--c);color:#05080c;border-radius:6px 6px 2px 2px;
  box-shadow:0 10px 26px rgba(0,0,0,.55);text-align:center;line-height:1.05}
.whohdr b{display:block;font:400 21px/1 var(--stencil);letter-spacing:.06em;text-transform:uppercase}
.whohdr span{display:block;margin-top:4px;font:700 11px/1.1 var(--ui);letter-spacing:.16em;text-transform:uppercase}
.tokfly{position:fixed;z-index:9;font-size:11px;letter-spacing:.12em;padding:1px 5px;color:#1a1200;background:#f2c94c;box-shadow:0 0 14px #f2c94c}

/* the news: a TV lower third */
#news{position:fixed;left:calc((100% - var(--side)) / 2);bottom:206px;transform:translate(-50%,0);z-index:7;display:none;width:min(820px,62vw);pointer-events:none}
#news.on{display:flex}
#news .tag{flex:none;display:flex;align-items:center;padding:0 18px;font:400 24px/1 var(--stencil);letter-spacing:.08em;text-transform:uppercase;background:#d7263d;color:#fff}
#news .tag.scandal{background:#ff9f40;color:#2a1300}
#news .tag.classified{background:#6a3fb5}
#news .body{flex:1;background:linear-gradient(90deg,#f1ece0,#e6dfcf);color:#14100a;padding:10px 16px 11px;border-bottom:4px solid var(--c);min-width:0}
#news .chan{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6a5d48}
#news .head{font:700 22px/1.15 Georgia,'Times New Roman',serif;margin:3px 0 4px}
#news .sub{font-size:12.5px;color:#4a4134;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nstamp{position:absolute;right:26px;top:-18px;font:400 30px/1 var(--stencil);letter-spacing:.1em;text-transform:uppercase;color:#d7263d;border:4px solid #d7263d;padding:4px 10px;background:rgba(241,236,224,.92)}

#title{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at center,rgba(4,8,12,.82),rgba(4,8,12,.97));transition:opacity .6s}
#title.gone{opacity:0;pointer-events:none}
#title h1{margin:0;font:400 min(16vw,150px)/1 var(--stencil);letter-spacing:.06em;text-shadow:0 0 40px rgba(255,90,60,.45)}
#title p{margin:0;color:var(--dim);letter-spacing:.3em;text-transform:uppercase;font-size:14px}
#title button{font-size:18px;padding:14px 28px;margin-top:14px;background:var(--hot);border-color:var(--hot);color:#1a0500}
#title small{color:#3d5266;letter-spacing:.1em}
/* ---- human play ---- */
.pl.me{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,rgba(6,12,18,.9)),rgba(6,12,18,.9))}
.pl.me .nm span{color:var(--ink);font-weight:600}
#undo{display:none}
body.human #undo{display:inline-block}

/* your hand: a fan, bottom left above your panel */
#fan{position:fixed;left:26px;bottom:194px;height:180px;width:600px;z-index:7;pointer-events:none}
#fan .fc{position:absolute;bottom:0;left:var(--x);width:126px;height:176px;transform-origin:50% 150%;transform:rotate(var(--a));pointer-events:auto;border-radius:6px;box-shadow:0 8px 18px rgba(0,0,0,.6)}
/* the card stays put as the hover target; only its picture lifts, so it can't slide out from under the mouse */
#fan .fc .lift{position:absolute;inset:0;border-radius:6px;transition:transform .18s;transform-origin:50% 100%}
#fan .fc:hover{z-index:20}
#fan:has(.fc:hover){z-index:9}
#fan .fc:hover .lift{transform:rotate(calc(var(--a) * -1)) translateY(-120px) scale(1.65);box-shadow:0 20px 50px rgba(0,0,0,.8)}
#fan .fc.pick{cursor:pointer}
#fan .fc.pick .lift{outline:3px solid #fff;outline-offset:2px;animation:pickpulse 1.1s ease-in-out infinite}
@keyframes pickpulse{50%{outline-color:rgba(255,255,255,.35)}}
.mini{position:absolute;left:0;top:0;width:210px;height:294px;transform-origin:0 0;pointer-events:none}
#fan .mini{transform:scale(.6)}

/* the question: bottom left, above your hand */
#slip{position:fixed;left:18px;bottom:400px;z-index:8;display:none;max-width:min(600px,44vw);padding:12px 14px 14px;
  background:rgba(6,12,18,.94);border:1px solid #2a4a66;border-left:4px solid var(--teal);box-shadow:0 16px 40px rgba(0,0,0,.6)}
#slip.on{display:block}
/* questions you answer on the map sit on the right, clear of the city plates */
#slip.side{left:auto;right:8px;top:282px;bottom:auto;width:calc(var(--side) - 16px);max-width:none;max-height:calc(100vh - 282px - 192px);overflow:auto}
#slip.side .sq{font-size:19px}
#slip.side .opt{padding:7px 10px}
#slip.side .sopts{flex-direction:column}
#slip .sq{font:400 22px/1.15 var(--stencil);letter-spacing:.04em;text-transform:uppercase}
#slip .sh{margin-top:5px;color:#a9b8c7;font-size:13px;line-height:1.35}
#slip .sh.map{color:var(--teal)}
#slip .sopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#slip .opt{font-size:13px;padding:9px 13px}
#slip .opt.pass{background:transparent;color:var(--dim)}
#slip .opt.cont,#slip .opt.city{border-left:4px solid var(--c)}
#slip .opt.city small{color:var(--dim);margin-left:4px}
#slip .opt.card{position:relative;width:105px;height:147px;padding:0;border:0;background:none;border-radius:6px}
#slip .opt.card .mini{transform:scale(.5);transition:transform .15s}
#slip .opt.card:hover .mini{transform:translateY(-6px) scale(.5);outline:6px solid #fff;outline-offset:4px;border-radius:12px}

/* the setup screen */
#title .setup{display:flex;flex-direction:column;gap:8px;width:min(520px,92vw);margin-top:10px}
.srow{display:grid;grid-template-columns:22px 1fr 1fr;gap:8px;align-items:center}
.sn{color:var(--dim);font:400 18px/1 var(--stencil)}
#title select{font:600 14px/1 var(--ui);color:var(--ink);background:#0c1822;border:1px solid #2a4a66;padding:9px 8px;border-radius:2px}
#title select:disabled{opacity:.35}
.slen{display:flex;gap:6px;margin-top:6px}
.slen button{flex:1}
.shint{margin:4px 0 0 !important;letter-spacing:.04em !important;text-transform:none !important;font-size:13px !important;text-align:center}
.sgo{display:flex;gap:10px;justify-content:center}
#title .sgo button{margin-top:8px}
#title .slen button{background:transparent;border-color:#2a4a66;color:var(--dim);font-size:14px;padding:10px;margin:0}
#title .slen button.on{box-shadow:0 0 18px -6px var(--teal);background:var(--teal);border-color:var(--teal);color:#03231e}
#title .sgo button.alt{background:transparent;border-color:var(--teal);color:var(--teal)}
#title .sgo button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="stage"></div>
<div id="top">
  <div class="brand">NUKE'EM<span>Situation room</span></div>
  <div id="status"></div>
  <div id="ctl">
    <button data-speed="step" title="Wait for Next at every turn">Step</button><button data-speed="1">1&times;</button><button data-speed="2" class="on">2&times;</button><button data-speed="4">4&times;</button>
    <button id="undo">Undo</button><button id="pause">Pause</button><span class="gap"></span><button id="mute" class="on">Sound on</button><button id="new">New game</button>
  </div>
</div>
<div id="sidebar"><h3 style="top:352px">Wire</h3></div>
<div id="clock"></div>
<div id="ticker"></div>
<button id="next"></button>
<div id="banner"></div>
<div id="players"></div>
<div id="decks"><div class="deck" id="deck-build"><div class="cbk build"><span>NUKE'EM</span><b>Build</b></div><em id="db-n"></em></div><div class="deck" id="deck-prop"><div class="cbk propaganda"><span>NUKE'EM</span><b>Propaganda</b></div><em id="dp-n"></em></div><div class="deck discard" id="deck-discard"><div class="pile">Discard</div><em id="dd-n"></em></div></div>
<div id="news"></div>
<div id="fan"></div>
<div id="slip"></div>
<div id="fly"></div>
